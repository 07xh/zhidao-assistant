name: Zhidao Assistant regression and Windows syntax

on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'src/**'
      - 'research/**'
      - 'test_*.py'
      - 'test_*.cjs'
      - 'build.py'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Offline tests and Windows x64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: 'payload:research:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Install test dependencies
        run: python -m pip install 'httpx==0.28.1'
      - name: Run Python and JavaScript regression suites
        run: |
          python -m unittest discover -v -p 'test_*.py'
          python -m unittest -v research.test_heartbeat_lab
          node test_media_controller.cjs
          python -m compileall -q payload build.py
      - name: Cross-compile and checksum unreleased Windows installer
        run: |
          set -euo pipefail
          python build.py
          EXE="ZhidaoAssistant-Setup-v5.2.8-dev.exe"
          file "$EXE"
          file "$EXE" | grep -q PE32
          sha256sum "$EXE" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Save tested development installer (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: ZhidaoAssistant-v5.2.8-dev-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            ZhidaoAssistant-Setup-v5.2.8-dev.exe
            SHA256SUMS.txt

  windows-syntax:
    name: Windows PowerShell 5.1 source parse
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell scripts without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path payload -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Host ("Syntax issue {0}:{1}:{2} {3}" -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
                Write-Host ("  Source: " + $_.Extent.Text)
              }
              throw "PowerShell parser failed: $($_.Name)"
            }
            Write-Host "Parsed $($_.Name)"
          }
      - name: Test login state module with fake local cookies
        shell: powershell
        run: .\\test_session_state.ps1
      - name: Test session-bound progress verification queue
        shell: powershell
        run: .\\test_pending_verify.ps1
