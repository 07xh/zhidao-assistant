name: Publish v5.2.9 beta Windows test release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v529-beta2.yml'

permissions:
  contents: write

concurrency:
  group: zhidao-v529-beta2-release
  cancel-in-progress: false

jobs:
  windows-verify:
    if: "startsWith(github.event.head_commit.message, 'release: v5.2.9-beta.2')"
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem payload -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell syntax invalid: $($_.Name)" }
          }
      - name: Run fake-cookie import and session-scoping tests
        shell: powershell
        run: |
          .\test_session_state.ps1
          .\test_pending_verify.ps1
          .\test_cookie_import.ps1

  publish:
    needs: windows-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: 'payload:research:.'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Run offline regression tests
        run: |
          set -euo pipefail
          python -m pip install 'httpx==0.28.1'
          python -m unittest discover -v -p 'test_*.py'
          python -m unittest -v research.test_heartbeat_lab
          node test_media_controller.cjs
          python -m compileall -q payload build.py
      - name: Compile Windows installer and calculate SHA-256
        run: |
          set -euo pipefail
          python build.py
          EXE='ZhidaoAssistant-Setup-v5.2.9-beta.2.exe'
          file "$EXE" | grep -q 'PE32'
          sha256sum "$EXE" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish pre-release and installer asset
        run: |
          set -euo pipefail
          if gh release view 'v5.2.9-beta.2' >/dev/null 2>&1; then
            echo 'The release already exists; refusing to overwrite assets.'
            exit 1
          fi
          gh release create 'v5.2.9-beta.2' \
            'ZhidaoAssistant-Setup-v5.2.9-beta.2.exe' SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title 'Zhidao Assistant v5.2.9 Beta 2 (Windows x64)' \
            --notes-file CHANGELOG-V5.2.9-beta.1.md \
            --prerelease
